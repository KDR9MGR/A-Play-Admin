name: a_play_organiser
description: "A Flutter event organizer app with dark + orange theme"
publish_to: 'none'
version: 1.0.2+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: 2.6.1
  
  # Functional Programming
  fpdart: 1.2.0
  
  # Code Generation
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0
  
  # Backend
  supabase_flutter: 2.10.3
  
  # Navigation
  go_router: 14.8.1
  
  # UI
  flutter_svg: 2.2.3
  cached_network_image: 3.4.1
  animated_notch_bottom_bar: 1.0.3
  icons_plus: 5.0.0
  url_launcher: 6.3.2
  
  # Image & File Handling
  image_picker: 1.2.1
  
  # Utilities
  intl: 0.19.0
  
  # Charts & Animations
  fl_chart: 1.1.1
  animate_do: 3.3.9
  
  # Icons & Fonts
  ionicons: 0.2.2
  
  # Video
  video_player: 2.10.1
  google_fonts: 8.0.0

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  
  # Code Generation
  build_runner: 2.5.4
  freezed: 2.5.8
  json_serializable: 6.9.5

flutter_icons:
  android: true
  ios: true
  image_path: "assets/playstore.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/svgs/
    - assets/splash.mp4
